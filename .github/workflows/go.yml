name: Go
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./cmd/platform
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke against Go and a disposable core catalog
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/ui-store" "$RUNNER_TEMP/ui-evidence"
          go run ./web/scripts/fixture.go "$RUNNER_TEMP/ui-store"
          go build -o "$RUNNER_TEMP/platform" ./cmd/platform
          "$RUNNER_TEMP/platform" --store "$RUNNER_TEMP/ui-store" --web-dir web/dist/browser --listen 127.0.0.1:18080 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:18080/api/v1/repository >/dev/null && break; sleep 1; done
          cd web
          UI_BASE_URL=http://127.0.0.1:18080 UI_EVIDENCE_DIR="$RUNNER_TEMP/ui-evidence" node scripts/smoke.mjs
